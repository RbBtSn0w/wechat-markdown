version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10
    groups:
      npm_and_yarn:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
