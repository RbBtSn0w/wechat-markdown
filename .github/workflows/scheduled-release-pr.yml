name: Scheduled Release PR

on:
  schedule:
    # Every Friday at 15:00 Beijing time (UTC+8) -> 07:00 UTC
    - cron: '0 7 * * 5'
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  create-release-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.RBBTSN0W_BOT_APP_ID }}
          private-key: ${{ secrets.RBBTSN0W_BOT_PRIVATE_KEY }}
      - name: Create or reuse release PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/pr.cjs release
