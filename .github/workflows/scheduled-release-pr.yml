name: Scheduled Release PR

on:
  schedule:
    # Every Friday at 15:00 Beijing time (UTC+8) -> 07:00 UTC
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create develop -> main Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Check for changes between develop and main
        id: check_diff
        run: |
          git fetch origin main:main
          AHEAD_COUNT="$(git rev-list --count main..develop)"
          echo "Commits on develop ahead of main: ${AHEAD_COUNT}"
          if [ "${AHEAD_COUNT}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new commits on develop since last release. Skipping PR creation."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and configure Auto-merge PR
        if: steps.check_diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_PROMPT: '1'
        run: |
          DATE="$(date -u +'%Y-%m-%d')"
          PR_TITLE="chore(release): scheduled release from develop (${DATE})"
          BODY_FILE="$(mktemp)"
          cleanup() { rm -f "$BODY_FILE"; }
          trap cleanup EXIT

          {
            echo "## 🚢 Scheduled Weekly Release Train"
            echo ""
            echo "This PR automatically promotes verified changes from \`develop\` into \`main\`."
            echo "- **Trigger**: Friday 15:00 Beijing time (UTC+8) scheduled release train."
            echo "- **Auto-merge**: Enabled (\`--auto --squash\`)."
            echo "- Once required CI checks pass, this PR merges automatically to trigger stable release."
          } > "$BODY_FILE"

          EXISTING_PR="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"

          if [ -n "${EXISTING_PR}" ]; then
            echo "Open release PR #${EXISTING_PR} already exists. Ensuring auto-merge is active..."
            gh pr merge "${EXISTING_PR}" --auto --squash
          else
            echo "Creating new release PR..."
            NEW_PR="$(gh pr create --base main --head develop --title "${PR_TITLE}" --body-file "${BODY_FILE}")"
            echo "Created ${NEW_PR}. Enabling auto-merge..."
            gh pr merge "${NEW_PR}" --auto --squash
          fi
