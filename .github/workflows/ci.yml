name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Build (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run Tests
        run: npm test -- --testTimeout=15000

      - name: Build TypeScript
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Verify packed consumer
        run: npm run verify:package

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if npm run audit:prod; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1

  verify-gate:
    name: Verify gate
    needs: [verify, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: test "$VERIFY_RESULT" = success && test "$AUDIT_RESULT" = success

  pr-dev-release:
    name: PR Dev Preview Release
    needs: verify-gate
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    env:
      npm_config_ignore_scripts: 'true'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Calculate preview version and save artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERSION="$(node -p 'require("./package.json").version.replace(/-.*$/, "")')-dev.pr${PR_NUMBER}.${HEAD_SHA}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          node scripts/release/artifact.cjs preview "$VERSION"
      - name: Attempt both registries and require at least one verified preview
        run: |
          printf '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}\n' > "$RUNNER_TEMP/preview.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/preview.npmrc"
          node scripts/release/artifact.cjs publish
      - name: Post or update preview verification comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const receipt = JSON.parse(fs.readFileSync('release-artifact/receipt.json', 'utf8'));
            const header = '### 🚀 PR Dev Preview Released';
            const registries = Object.entries(receipt.registries)
              .filter(([, state]) => state === 'verified')
              .map(([registry]) => `| ${registry === 'npm' ? 'npm' : 'GitHub Packages'} | \`${receipt.name}@${receipt.version}\` |`);
            if (!registries.length) throw new Error('No verified preview to announce');
            const body = [
              header,
              '',
              'The package contents were downloaded and verified for these registries:',
              '',
              '| Registry | Package |',
              '| :--- | :--- |',
              ...registries,
              '',
              `Verification evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(header));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
      - name: Persist preview verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: release-artifact/
          if-no-files-found: ignore
