name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Build (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run Tests
        run: npm test -- --testTimeout=15000

      - name: Build TypeScript
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Verify packed consumer
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed"
          npm run test:package -- "$RUNNER_TEMP"/packed/*.tgz

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if npm run audit:prod; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1

  verify-gate:
    name: Verify gate
    needs: [verify, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: test "$VERIFY_RESULT" = success && test "$AUDIT_RESULT" = success
