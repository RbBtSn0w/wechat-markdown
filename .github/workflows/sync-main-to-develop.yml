name: Sync main to develop

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-artifact
      - name: Create App token for CI-triggering sync PR
        uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.RBBTSN0W_BOT_APP_ID }}
          private-key: ${{ secrets.RBBTSN0W_BOT_PRIVATE_KEY }}
      - name: Create or reuse sync PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/pr.cjs sync
      - name: Persist sync outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-complete
          path: release-artifact/
          retention-days: 90
